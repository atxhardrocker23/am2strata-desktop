[package]
name = "am2strata-desktop"
version = "0.1.0"
edition = "2021"
description = "Native Windows desktop app for am2Strata (WebView2, system tray, headless engine supervisor, mic & drag-drop)"
build = "build.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["os-webview"] }
tray-icon = "0.26"
muda = "0.21"
global-hotkey = "0.10"
webview2-com = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
open = "5"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
